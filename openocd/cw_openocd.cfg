# ChipWhisperer in MPSSE mode (ftdi-compatible via enable_MPSSE())
# VID 0x2b3e, PID passed on command line: 0xace5 husky, 0xace3 pro, 0xace2 lite, 0xace0 nano

adapter driver ftdi

# MPSSE channel + SWD signal routing (required for SWD on the CW MPSSE).
# Without SWD_EN/SWDIO_OE, OpenOCD errors: "SWD_EN signal is not defined".
ftdi channel 1
ftdi layout_init 0x001B 0x001B
ftdi layout_signal nSRST -data 0x0010
ftdi layout_signal SWD_EN -data 0x0100
ftdi layout_signal SWDIO_OE -data 0x0200

reset_config srst_push_pull

adapter speed 5000