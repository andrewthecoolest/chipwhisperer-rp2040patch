#
# SWD adapter: Raspberry Pi Pico running debugprobe (CMSIS-DAP)
# https://github.com/raspberrypi/debugprobe/releases
#
# Wiring to CW308T-RP2040:
#   Pico GP2 → SWDCLK (CW pin 13 PDIC)
#   Pico GP3 → SWDIO  (CW pin 15 PDID)
#   Pico GND → GND
#
# NOTE: CWLite (0xace2) uses SAM3U USB — not an FT2232H.
#       The ftdi adapter driver cannot be used with CWLite.

adapter driver cmsis-dap
adapter speed 5000